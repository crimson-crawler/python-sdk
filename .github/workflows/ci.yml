name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

# Superseded validation runs carry no value, so unlike the release pipeline this
# cancels in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.7"
          enable-cache: false
      - name: Validate
        run: |
          uv sync --locked --extra dev
          uv run --locked --extra dev python scripts/codegen.py
          git diff --exit-code -- src/crimson_crawler_client/_generated
          uv run --locked --extra dev ruff format --check
          uv run --locked --extra dev ruff check
          uv run --locked --extra dev mypy
          uv run --locked --extra dev pytest tests
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Scans the whole tracked tree, not just packaged members: a credential pasted
      # into a test, workflow, or doc is public the moment it lands here even when the
      # release verifier excludes it from the wheel. `.gitleaks.toml` is the same
      # policy the monorepo gate uses, exported to the repository root.
      - name: Scan repository for secrets
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir . --config .gitleaks.toml --redact --no-banner
